<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;height:100%;background:transparent;overflow:hidden}canvas{width:100%;height:100%;display:block}
.fb{display:none;font:90px sans-serif;text-align:center;padding-top:60px}</style></head><body>
<canvas id="c"></canvas><div class="fb" id="fb">🎓</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
try{
const cv=document.getElementById('c'),R=new THREE.WebGLRenderer({canvas:cv,alpha:true,antialias:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));
const S=new THREE.Scene(),cam=new THREE.PerspectiveCamera(42,1,.1,100);cam.position.set(0,1.6,11.5);cam.lookAt(0,.2,0);
S.add(new THREE.AmbientLight(0xffffff,.65));
const dl=new THREE.DirectionalLight(0xffffff,1.0);dl.position.set(3,6,5);S.add(dl);
const p1=new THREE.PointLight(0x5eead4,1.1,30);p1.position.set(-5,2,4);S.add(p1);
const p2=new THREE.PointLight(0xa78bfa,1.1,30);p2.position.set(5,-2,4);S.add(p2);
const navy=new THREE.MeshStandardMaterial({color:0x1b2559,roughness:.4,metalness:.3}),
dark=new THREE.MeshStandardMaterial({color:0x121a45,roughness:.5,metalness:.2}),
gold=new THREE.MeshStandardMaterial({color:0xfbbf24,roughness:.25,metalness:.7});
const cap=new THREE.Group();
const board=new THREE.Mesh(new THREE.BoxGeometry(3.6,.16,3.6),navy);board.rotation.y=Math.PI/4;board.position.y=.6;cap.add(board);
const trim=new THREE.LineSegments(new THREE.EdgesGeometry(board.geometry),new THREE.LineBasicMaterial({color:0x5eead4}));
trim.rotation.y=board.rotation.y;trim.position.y=.6;cap.add(trim);
const base=new THREE.Mesh(new THREE.CylinderGeometry(1.1,1.3,1,48),dark);base.position.y=0;cap.add(base);
const band=new THREE.Mesh(new THREE.TorusGeometry(1.2,.05,12,64),gold);band.rotation.x=Math.PI/2;band.position.y=-.35;cap.add(band);
const btn=new THREE.Mesh(new THREE.SphereGeometry(.14,24,24),gold);btn.position.y=.76;cap.add(btn);
const cx=1.8*Math.SQRT2;
const cord=new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3([new THREE.Vector3(0,.78,0),new THREE.Vector3(cx*.5,.8,0),new THREE.Vector3(cx-.2,.68,0)]),30,.03,8),gold);cap.add(cord);
const tas=new THREE.Group();tas.position.set(cx-.2,.68,0);
const knot=new THREE.Mesh(new THREE.SphereGeometry(.1,16,16),gold);tas.add(knot);
const str=new THREE.Mesh(new THREE.CylinderGeometry(.05,.17,1,24),gold);str.position.y=-.55;tas.add(str);
cap.add(tas);cap.rotation.x=.28;S.add(cap);
const ring=new THREE.Mesh(new THREE.TorusGeometry(3.6,.015,8,120),new THREE.MeshBasicMaterial({color:0x5eead4,transparent:true,opacity:.55}));ring.rotation.x=1.2;S.add(ring);
const ring2=new THREE.Mesh(new THREE.TorusGeometry(4.2,.012,8,120),new THREE.MeshBasicMaterial({color:0xa78bfa,transparent:true,opacity:.5}));ring2.rotation.x=1.7;ring2.rotation.y=.6;S.add(ring2);
const pa=new Float32Array(600);for(let i=0;i<600;i++)pa[i]=(Math.random()-.5)*14;
const pg=new THREE.BufferGeometry();pg.setAttribute('position',new THREE.BufferAttribute(pa,3));
const pts=new THREE.Points(pg,new THREE.PointsMaterial({color:0xffffff,size:.05,transparent:true,opacity:.75}));S.add(pts);
let mx=0,my=0,dragging=false,rot=0;
addEventListener('pointermove',e=>{mx=e.clientX/innerWidth-.5;my=e.clientY/innerHeight-.5});
function rs(){R.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
addEventListener('resize',rs);rs();
(function a(t){t/=1000;rot+=.008;cap.rotation.y=rot+mx*.9;cap.rotation.x=.28+my*.35;cap.position.y=Math.sin(t*1.4)*.18;
tas.rotation.z=Math.sin(t*2)*.12;ring.rotation.z=t*.4;ring2.rotation.z=-t*.3;pts.rotation.y=t*.05;
R.render(S,cam);requestAnimationFrame(a)})(0);
}catch(e){document.getElementById('c').style.display='none';document.getElementById('fb').style.display='block'}
</script></body></html>
